
<!DOCTYPE html>
<html>
<head>
    <title>Country and Capital</title>

    <style>
        body {
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: #fff0f5;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            margin: auto;
            box-shadow: 0 4px 10px #d8b4c8;
        }

        h1 {
            color: #ad1457;
        }

        label {
            color: #6a1b4d;
            font-size: 18px;
        }

        select {
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #d48aaa;
            font-size: 16px;
        }

        #capital {
            display: block;
            color: #880e4f;
            font-weight: bold;
            font-size: 24px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Country and Capital</h1>

        <label for="country">Select a Country:</label>
        <br>

        <select id="country">
            <option value="">-- Select Country --</option>
            <option value="New Delhi">India</option>
            <option value="Washington, D.C.">United States</option>
            <option value="Tokyo">Japan</option>
            <option value="Canberra">Australia</option>
            <option value="Paris">France</option>
        </select>

        <span id="capital"></span>

    </div>

    <script>
        const country = document.getElementById("country");
        const capital = document.getElementById("capital");

        country.addEventListener("change", function() {
            capital.textContent = this.value;
        });
    </script>

</body>
</html>
